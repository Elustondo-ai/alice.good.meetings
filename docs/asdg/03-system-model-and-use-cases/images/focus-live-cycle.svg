<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img" aria-labelledby="title desc">
  <title id="title">Focus question and Live question cycle</title>
  <desc id="desc">Four steps repeat. A question is heard and the Live area fills automatically. Pablo presses Confirm question, which copies the exact Live wording into the Focus area and clears Live. Pablo answers while Focus stays fixed and Live keeps following speech. When a new question appears in Live, Pablo can confirm again. Only Confirm question writes Focus; speech only writes Live. Clear live clears Live without touching Focus. A concept panel on the right shows both areas visible at once, with Focus holding the earlier question and Live holding a new one.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#365b70" stroke-width="2.3"/></marker>
    <marker id="arrowConfirm" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#a5521b" stroke-width="2.3"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #203b4a; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { font-size: 20px; fill: #526b79; }
      .num { font-size: 22px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; }
      .tag { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
      .line { fill: none; stroke: #365b70; stroke-width: 2.6; marker-end: url(#arrow); }
      .confirm { fill: none; stroke: #a5521b; stroke-width: 3; marker-end: url(#arrowConfirm); }
      .mono { font-size: 16px; fill: #e8f2ea; }
      .panelLabel { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #b9d3bf; }
      .panelText { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .panelItalic { font-size: 17px; font-style: italic; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1100" height="1000" fill="#fbfcfd"/>
  <text x="50" y="55" class="title">Focus question and Live question</text>
  <text x="50" y="88" class="sub">UC-04 · Proposed 4 Nov 2026 · Only Confirm question writes Focus</text>

  <!-- Cycle (left) -->
  <circle cx="80" cy="160" r="20" fill="#26716c"/><text x="80" y="168" class="num">1</text>
  <rect x="115" y="120" width="460" height="100" rx="14" fill="#eff7f6" stroke="#397874" stroke-width="2"/>
  <text x="135" y="155" class="heading">A question is heard</text>
  <text x="135" y="183" class="body">Live fills automatically from speech.</text>
  <text x="135" y="207" class="body">Focus is unchanged.</text>
  <path d="M345 220 V265" class="line"/>

  <circle cx="80" cy="310" r="20" fill="#a5521b"/><text x="80" y="318" class="num">2</text>
  <rect x="115" y="270" width="460" height="125" rx="14" fill="#fbf1e8" stroke="#a5521b" stroke-width="2.5"/>
  <text x="135" y="305" class="heading">Pablo presses Confirm question</text>
  <text x="135" y="333" class="body">The exact Live wording he sees becomes</text>
  <text x="135" y="357" class="body">the Focus question. Live clears and refills</text>
  <text x="135" y="381" class="body">only from speech after the confirmation.</text>
  <path d="M345 395 V440" class="line"/>

  <circle cx="80" cy="485" r="20" fill="#26716c"/><text x="80" y="493" class="num">3</text>
  <rect x="115" y="445" width="460" height="100" rx="14" fill="#eff7f6" stroke="#397874" stroke-width="2"/>
  <text x="135" y="480" class="heading">Pablo reflects and answers</text>
  <text x="135" y="508" class="body">Focus stays fixed. Live may show a</text>
  <text x="135" y="532" class="body">restatement, or nothing.</text>
  <path d="M345 545 V590" class="line"/>

  <circle cx="80" cy="635" r="20" fill="#26716c"/><text x="80" y="643" class="num">4</text>
  <rect x="115" y="595" width="460" height="100" rx="14" fill="#eff7f6" stroke="#397874" stroke-width="2"/>
  <text x="135" y="630" class="heading">A new question appears in Live</text>
  <text x="135" y="658" class="body">Focus still holds the earlier question</text>
  <text x="135" y="682" class="body">until Pablo confirms again.</text>
  <path d="M575 645 H605 V332 H585" class="confirm"/>
  <text x="615" y="480" class="tag" fill="#a5521b" transform="rotate(90 615 480)">CONFIRM AGAIN</text>

  <!-- Rules -->
  <rect x="50" y="730" width="560" height="225" rx="14" fill="#edf2f8" stroke="#57768d" stroke-width="2"/>
  <text x="70" y="765" class="heading">Who writes each area</text>
  <text x="70" y="800" class="body"><tspan font-weight="700">Focus:</tspan> only Confirm question. Never speech,</text>
  <text x="70" y="824" class="body">silence, model confidence or a late response.</text>
  <text x="70" y="858" class="body"><tspan font-weight="700">Live:</tspan> automatic interpretation of speech:</text>
  <text x="70" y="882" class="body">new questions, restatements, corrections.</text>
  <text x="70" y="916" class="body"><tspan font-weight="700">Clear live:</tspan> clears Live and</text>
  <text x="70" y="940" class="body">listens again. It never touches Focus.</text>

  <!-- Concept panel (right) -->
  <text x="665" y="140" class="tag" fill="#526b79">CONCEPT, NOT A SCREENSHOT</text>
  <text x="665" y="165" class="body" fill="#526b79">Step 4 as the panel could show it</text>
  <rect x="660" y="185" width="400" height="420" rx="12" fill="#0f2f17" stroke="#26716c" stroke-width="2"/>
  <text x="680" y="220" class="panelLabel">FOCUS QUESTION (CONFIRMED)</text>
  <text x="680" y="248" class="panelText">Tell me about your last two</text>
  <text x="680" y="272" class="panelText">jobs and why you left the</text>
  <text x="680" y="296" class="panelText">second one.</text>
  <line x1="680" y1="320" x2="1040" y2="320" stroke="#3d6b48" stroke-width="1.5"/>
  <text x="680" y="350" class="panelLabel">LIVE QUESTION (AUTOMATIC)</text>
  <text x="1032" y="350" text-anchor="end" style="font-size:14px;font-style:italic;fill:#9fc2a7">new question</text>
  <rect x="680" y="362" width="4" height="74" fill="#f2c94c"/>
  <text x="694" y="382" class="panelItalic">What would your previous</text>
  <text x="694" y="406" class="panelItalic">manager say is your biggest</text>
  <text x="694" y="430" class="panelItalic">weakness?</text>
  <rect x="680" y="470" width="150" height="38" rx="5" fill="#e6e6e6" stroke="#9a9a9a"/>
  <text x="755" y="495" class="body" text-anchor="middle" fill="#203b4a">Clear live</text>
  <rect x="842" y="470" width="180" height="38" rx="5" fill="#fbe3cc" stroke="#a5521b" stroke-width="2"/>
  <text x="932" y="495" class="body" text-anchor="middle" fill="#203b4a">Confirm question</text>
  <text x="680" y="545" class="mono">Confirm copies Live into Focus.</text>
  <text x="680" y="570" class="mono">Timer cue behind the panel: LAND IT</text>
  <path d="M932 470 V452 H1048 V258 H1040" fill="none" stroke="#f2a35e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowConfirm)"/>

  <rect x="660" y="635" width="400" height="320" rx="14" fill="#eff7f6" stroke="#397874" stroke-width="2"/>
  <text x="680" y="670" class="heading">Empty and edge states</text>
  <text x="680" y="703" class="body">No focus question yet</text>
  <text x="680" y="727" class="body">Listening for a question…</text>
  <text x="680" y="761" class="body">Confirm disabled when Live is empty,</text>
  <text x="680" y="785" class="body">equals Focus, or a request is pending;</text>
  <text x="680" y="809" class="body">a hint explains why.</text>
  <text x="680" y="843" class="body">Uncertain confirmation: wording frozen,</text>
  <text x="680" y="867" class="body">Retry confirmation sends the same text.</text>
  <text x="680" y="901" class="body">Stopped or disconnected: Focus shown</text>
  <text x="680" y="925" class="body">as last known, not live.</text>
</svg>
