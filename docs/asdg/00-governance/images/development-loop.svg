<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">How we move SpeakerCoach forward</title>
  <desc id="desc">A development loop from benefit to scenario, evaluation, agreed scope, and build and review. Results inform the next increment. Pablo makes direction and scope decisions, supported by assistant proposals and evidence. As of 23 October 2026, documentation is under review and no release or sprint is active.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#49716e"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 36px; font-weight: 700; fill: #17332f; }
      .subtitle { font-size: 21px; fill: #526762; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; fill: #536b65; }
      .heading { font-size: 24px; font-weight: 700; fill: #17332f; }
      .step { font-size: 19px; font-weight: 700; fill: #17332f; }
      .body { font-size: 19px; fill: #405a54; }
      .small { font-size: 17px; fill: #526762; }
      .card { fill: #fff; stroke: #c7d8d1; stroke-width: 2; }
      .flow { fill: none; stroke: #49716e; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="660" rx="22" fill="#f5f8f4"/>
  <text x="48" y="60" class="title">How we move SpeakerCoach forward</text>
  <text x="48" y="96" class="subtitle">One useful increment. Clear decisions. Evidence we can discuss.</text>

  <rect x="48" y="126" width="1104" height="84" rx="12" fill="#e0eee7"/>
  <text x="70" y="158" class="heading">Pablo chooses the direction and the next work</text>
  <text x="70" y="188" class="body">Assistants explore questions, propose options and bring evidence to the decision.</text>

  <rect x="48" y="250" width="198" height="164" rx="14" class="card"/>
  <text x="68" y="282" class="label">PURPOSE</text>
  <text x="68" y="321" class="step">Clarify the benefit</text>
  <text x="68" y="356" class="body">Who does it help?</text>
  <text x="68" y="383" class="body">What gets better?</text>

  <rect x="274" y="250" width="198" height="164" rx="14" class="card"/>
  <text x="294" y="282" class="label">SCENARIO</text>
  <text x="294" y="321" class="step">Make it concrete</text>
  <text x="294" y="356" class="body">What happens in</text>
  <text x="294" y="383" class="body">a real interview?</text>

  <rect x="500" y="250" width="198" height="164" rx="14" class="card"/>
  <text x="520" y="282" class="label">EVALUATION</text>
  <text x="520" y="321" class="step">Define success</text>
  <text x="520" y="356" class="body">How will we know</text>
  <text x="520" y="383" class="body">it actually helps?</text>

  <rect x="726" y="250" width="198" height="164" rx="14" fill="#e0eee7" stroke="#49716e" stroke-width="2"/>
  <text x="746" y="282" class="label">DECISION</text>
  <text x="746" y="321" class="step">Agree on scope</text>
  <text x="746" y="356" class="body">Choose a small</text>
  <text x="746" y="383" class="body">piece of work.</text>

  <rect x="952" y="250" width="200" height="164" rx="14" class="card"/>
  <text x="972" y="282" class="label">LEARNING</text>
  <text x="972" y="321" class="step">Build and review</text>
  <text x="972" y="356" class="body">Compare results</text>
  <text x="972" y="383" class="body">with expectations.</text>

  <path d="M246 332 H268" class="flow"/>
  <path d="M472 332 H494" class="flow"/>
  <path d="M698 332 H720" class="flow"/>
  <path d="M924 332 H946" class="flow"/>
  <path d="M1052 414 V470 H147 V421" class="flow"/>
  <rect x="361" y="453" width="478" height="32" fill="#f5f8f4"/>
  <text x="600" y="476" text-anchor="middle" class="body">Use what we learn to choose the next increment</text>

  <rect x="48" y="526" width="1104" height="94" rx="12" fill="#fff2d8"/>
  <text x="70" y="556" class="label">CURRENT POSITION · 23 OCTOBER 2026</text>
  <text x="70" y="588" class="heading">Reviewing the documentation</text>
  <text x="1130" y="588" text-anchor="end" class="body">No active release or sprint</text>
</svg>
