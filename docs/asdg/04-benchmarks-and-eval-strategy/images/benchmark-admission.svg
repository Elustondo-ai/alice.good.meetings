<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">A recording is a candidate, not yet a benchmark</title><desc id="desc">Start with one development case; grow toward ten varied recordings.</desc>
<rect width="1200" height="470" rx="20" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="36" y="48" font-size="29" font-weight="700" fill="#0f172a">A recording is a candidate, not yet a benchmark</text><text x="36" y="82" font-size="18" fill="#475569">Start with one development case; grow toward ten varied recordings.</text><rect x="28" y="125" width="260" height="180" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="46" y="161" font-size="22" font-weight="700" fill="#0f172a">Capture</text><text x="46" y="201" font-size="18" fill="#334155">Agreed recording</text><text x="46" y="229" font-size="18" fill="#334155">Audio and output trace</text><text x="46" y="257" font-size="18" fill="#334155">Keep source identity</text><rect x="322" y="125" width="260" height="180" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="340" y="161" font-size="22" font-weight="700" fill="#0f172a">Check</text><text x="340" y="201" font-size="18" fill="#334155">Complete, permitted capture</text><text x="340" y="229" font-size="18" fill="#334155">Sensitive material</text><text x="340" y="257" font-size="18" fill="#334155">Known capture conditions</text><rect x="616" y="125" width="260" height="180" rx="14" fill="#fef3c7" stroke="#cbd5e1"/><text x="634" y="161" font-size="22" font-weight="700" fill="#0f172a">Annotate privately</text><text x="634" y="201" font-size="18" fill="#334155">Speakers; question meaning</text><text x="634" y="229" font-size="18" fill="#334155">Answer times and ambiguity</text><text x="634" y="257" font-size="18" fill="#334155">Review expected behavior</text><rect x="910" y="125" width="260" height="180" rx="14" fill="#dcfce7" stroke="#cbd5e1"/><text x="928" y="161" font-size="22" font-weight="700" fill="#0f172a">Admit and version</text><text x="928" y="201" font-size="18" fill="#334155">Declare development use</text><text x="928" y="229" font-size="18" fill="#334155">Reserve cases for later</text><text x="928" y="257" font-size="18" fill="#334155">Track suite and case changes</text><path d="M290 215L317 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M584 215L611 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M878 215L905 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="36" y="370" font-size="20" fill="#9a3412">Private references go to the evaluator — never to the runtime analysis.</text><text x="36" y="411" font-size="18" fill="#475569">Version changes let us separate a better product from an easier test case.</text></g></svg>
