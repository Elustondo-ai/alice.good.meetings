<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Four questions before calling the result successful</title><desc id="desc">Each level needs its own evidence; this is an evaluation model, not measured performance.</desc>
<rect width="1200" height="470" rx="20" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="36" y="48" font-size="29" font-weight="700" fill="#0f172a">Four questions before calling the result successful</text><text x="36" y="82" font-size="18" fill="#475569">Each level needs its own evidence; this is an evaluation model, not measured performance.</text><rect x="28" y="125" width="260" height="180" rx="14" fill="#e2e8f0" stroke="#cbd5e1"/><text x="46" y="161" font-size="22" font-weight="700" fill="#0f172a">1 · Is the test valid?</text><text x="46" y="201" font-size="18" fill="#334155">No future input or leakage</text><text x="46" y="229" font-size="18" fill="#334155">Known configuration and case</text><text x="46" y="257" font-size="18" fill="#334155">Access and delivery evidence</text><rect x="322" y="125" width="260" height="180" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="340" y="161" font-size="22" font-weight="700" fill="#0f172a">2 · Is it correct?</text><text x="340" y="201" font-size="18" fill="#334155">Right speaker and question</text><text x="340" y="229" font-size="18" fill="#334155">Complete, stable question</text><text x="340" y="257" font-size="18" fill="#334155">Grounded hints when in scope</text><rect x="616" y="125" width="260" height="180" rx="14" fill="#ccfbf1" stroke="#cbd5e1"/><text x="634" y="161" font-size="22" font-weight="700" fill="#0f172a">3 · Is it timely?</text><text x="634" y="201" font-size="18" fill="#334155">Visible while it can still help</text><text x="634" y="229" font-size="18" fill="#334155">Measure from answer onset</text><text x="634" y="257" font-size="18" fill="#334155">Reliable and legible display</text><rect x="910" y="125" width="260" height="180" rx="14" fill="#fef3c7" stroke="#cbd5e1"/><text x="928" y="161" font-size="22" font-weight="700" fill="#0f172a">4 · Does it help?</text><text x="928" y="201" font-size="18" fill="#334155">User retains the question</text><text x="928" y="229" font-size="18" fill="#334155">Guidance preserves attention</text><text x="928" y="257" font-size="18" fill="#334155">Observe live answering</text><path d="M290 215L317 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M584 215L611 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M878 215L905 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="36" y="370" font-size="20" fill="#0f172a">Leakage → invalid run. Missing evidence → unverified conclusion.</text><text x="36" y="411" font-size="18" fill="#475569">Correct replay output is evidence of behavior; live use is needed for evidence of benefit.</text></g></svg>
