<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Compare behavior fairly; assess usefulness separately</title><desc id="desc">Candidates remain proposals. No architecture or winner has been selected.</desc>
<rect width="1200" height="470" rx="20" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="36" y="48" font-size="29" font-weight="700" fill="#0f172a">Compare behavior fairly; assess usefulness separately</text><text x="36" y="82" font-size="18" fill="#475569">Candidates remain proposals. No architecture or winner has been selected.</text><rect x="36" y="120" width="300" height="170" rx="14" fill="#e2e8f0" stroke="#cbd5e1"/><text x="54" y="156" font-size="22" font-weight="700" fill="#0f172a">Same permitted inputs</text><text x="54" y="196" font-size="18" fill="#334155">Progressive audio</text><text x="54" y="224" font-size="18" fill="#334155">Declared background</text><text x="54" y="252" font-size="18" fill="#334155">Fresh session state</text><rect x="420" y="120" width="360" height="170" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="438" y="156" font-size="22" font-weight="700" fill="#0f172a">Automatic candidates</text><text x="438" y="196" font-size="18" fill="#334155">Fixed-rule baseline</text><text x="438" y="224" font-size="18" fill="#334155">Transcript-based semantic tracking</text><text x="438" y="252" font-size="18" fill="#334155">Streaming audio analysis</text><rect x="864" y="120" width="300" height="170" rx="14" fill="#ccfbf1" stroke="#cbd5e1"/><text x="882" y="156" font-size="22" font-weight="700" fill="#0f172a">Same scorecard</text><text x="882" y="196" font-size="18" fill="#334155">Attribution and question fidelity</text><text x="882" y="224" font-size="18" fill="#334155">Persistence, timing, reliability</text><text x="882" y="252" font-size="18" fill="#334155">Report differences and cost</text><path d="M342 205L412 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M786 205L856 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="36" y="330" width="1128" height="95" rx="14" fill="#fef3c7"/><text x="58" y="365" font-size="22" font-weight="700" fill="#0f172a">Separate live comparison: manual question display vs. no display</text><text x="58" y="399" font-size="18" fill="#475569">Tests potential usefulness; does not establish automatic recognition accuracy.</text></g></svg>
