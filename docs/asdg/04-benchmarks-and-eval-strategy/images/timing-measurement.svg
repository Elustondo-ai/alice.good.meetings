<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Measure what becomes visible, not just what the server returns</title><desc id="desc">Illustrative event order only: an answer may begin before or after final audio delivery.</desc>
<rect width="1200" height="490" rx="20" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="36" y="48" font-size="29" font-weight="700" fill="#0f172a">Measure what becomes visible, not just what the server returns</text><text x="36" y="82" font-size="18" fill="#475569">Illustrative event order only: an answer may begin before or after final audio delivery.</text><path d="M90 190L1110 190" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M180 175V205" stroke="#0f172a" stroke-width="3"/><text x="180" y="135" text-anchor="middle" font-size="18" fill="#0f172a">Question ends</text><text x="180" y="162" text-anchor="middle" font-size="18" fill="#475569">t0 + tQ</text><path d="M430 175V205" stroke="#0f172a" stroke-width="3"/><text x="430" y="135" text-anchor="middle" font-size="18" fill="#0f172a">Final chunk delivered</text><text x="430" y="162" text-anchor="middle" font-size="18" fill="#475569">tD</text><path d="M640 175V205" stroke="#0f172a" stroke-width="3"/><text x="640" y="135" text-anchor="middle" font-size="18" fill="#0f172a">Answer starts</text><text x="640" y="162" text-anchor="middle" font-size="18" fill="#475569">t0 + tA</text><path d="M970 175V205" stroke="#0f172a" stroke-width="3"/><text x="970" y="135" text-anchor="middle" font-size="18" fill="#0f172a">Correct display visible</text><text x="970" y="162" text-anchor="middle" font-size="18" fill="#475569">tV</text><path d="M180 225V245H430V225 M430 270V290H970V270 M640 315V335H970V315" fill="none" stroke="#0f766e" stroke-width="2"/>
<text x="305" y="272" text-anchor="middle" font-size="18" fill="#0f766e">Delivery delay</text>
<text x="700" y="316" text-anchor="middle" font-size="18" fill="#0f766e">Processing + display delay</text>
<text x="805" y="362" text-anchor="middle" font-size="18" fill="#0f766e">Arrival relative to answer onset</text>
<text x="36" y="414" font-size="19" fill="#0f172a">Total delay = tV − (t0 + tQ). Also report whether guidance arrived before, during or after the answer.</text>
<text x="36" y="450" font-size="18" fill="#9a3412">No correct display = a miss, not zero latency. Two seconds remains a proposed pilot threshold.</text></g></svg>
