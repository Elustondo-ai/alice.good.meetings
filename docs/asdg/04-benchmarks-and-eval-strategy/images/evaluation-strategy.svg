<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Three methods, three kinds of evidence</title><desc id="desc">Complementary checks throughout development — none replaces the others.</desc>
<rect width="1200" height="470" rx="20" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="36" y="48" font-size="29" font-weight="700" fill="#0f172a">Three methods, three kinds of evidence</text><text x="36" y="82" font-size="18" fill="#475569">Complementary checks throughout development — none replaces the others.</text><rect x="36" y="120" width="345" height="200" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="54" y="156" font-size="22" font-weight="700" fill="#0f172a">1 · Automatic replay</text><text x="54" y="196" font-size="18" fill="#334155">Recorded audio → timed chunks</text><text x="54" y="224" font-size="18" fill="#334155">Repeat the same case across versions</text><text x="54" y="252" font-size="18" fill="#334155">Assess attribution, meaning and delay</text><rect x="428" y="120" width="345" height="200" rx="14" fill="#ccfbf1" stroke="#cbd5e1"/><text x="446" y="156" font-size="22" font-weight="700" fill="#0f172a">2 · Air QA</text><text x="446" y="196" font-size="18" fill="#334155">Speaker → room → real microphone</text><text x="446" y="224" font-size="18" fill="#334155">Exercise the physical capture path</text><text x="446" y="252" font-size="18" fill="#334155">Assess noise, capture and display</text><rect x="820" y="120" width="344" height="200" rx="14" fill="#fef3c7" stroke="#cbd5e1"/><text x="838" y="156" font-size="22" font-weight="700" fill="#0f172a">3 · Live interview</text><text x="838" y="196" font-size="18" fill="#334155">Fresh questions → person answering</text><text x="838" y="224" font-size="18" fill="#334155">The person can react to the guidance</text><text x="838" y="252" font-size="18" fill="#334155">Assess attention and actual usefulness</text><path d="M208 335V360H992V335 M600 360V390" fill="none" stroke="#64748b" stroke-width="2"/><text x="600" y="422" text-anchor="middle" font-size="22" fill="#0f172a">Together: reproducible behavior + real capture + useful assistance</text></g></svg>
