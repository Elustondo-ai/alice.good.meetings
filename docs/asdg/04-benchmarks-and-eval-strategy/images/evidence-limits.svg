<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">What the current assessment can support</title><desc id="desc">Evidence categories from the 21 October assessment — no new experiment is claimed.</desc>
<rect width="1200" height="470" rx="20" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="36" y="48" font-size="29" font-weight="700" fill="#0f172a">What the current assessment can support</text><text x="36" y="82" font-size="18" fill="#475569">Evidence categories from the 21 October assessment — no new experiment is claimed.</text><rect x="36" y="125" width="345" height="200" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="54" y="161" font-size="22" font-weight="700" fill="#0f172a">Source inspected</text><text x="54" y="201" font-size="18" fill="#334155">Amplitude and elapsed-time display</text><text x="54" y="229" font-size="18" fill="#334155">No question-recognition path</text><text x="54" y="257" font-size="18" fill="#334155">Source behavior, not runtime proof</text><rect x="428" y="125" width="345" height="200" rx="14" fill="#fef3c7" stroke="#cbd5e1"/><text x="446" y="161" font-size="22" font-weight="700" fill="#0f172a">Experience reported</text><text x="446" y="201" font-size="18" fill="#334155">User-described prototype value</text><text x="446" y="229" font-size="18" fill="#334155">Mock-interview trials mentioned</text><text x="446" y="257" font-size="18" fill="#334155">Trial recordings not supplied</text><rect x="820" y="125" width="344" height="200" rx="14" fill="#e2e8f0" stroke="#cbd5e1"/><text x="838" y="161" font-size="22" font-weight="700" fill="#0f172a">Still to demonstrate</text><text x="838" y="201" font-size="18" fill="#334155">Admitted recordings and replay</text><text x="838" y="229" font-size="18" fill="#334155">Measured question-display quality</text><text x="838" y="257" font-size="18" fill="#334155">Live benefit and reliable capture</text><text x="36" y="390" font-size="20" fill="#0f172a">Keep inspected facts, reported experience and unverified outcomes distinct.</text></g></svg>
