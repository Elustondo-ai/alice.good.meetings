<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Keep the first experiment small</title><desc id="desc">Replay feasibility, feature quality and usefulness answer different questions.</desc>
<rect width="1200" height="470" rx="20" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="36" y="48" font-size="29" font-weight="700" fill="#0f172a">Keep the first experiment small</text><text x="36" y="82" font-size="18" fill="#475569">Replay feasibility, feature quality and usefulness answer different questions.</text><rect x="36" y="125" width="345" height="200" rx="14" fill="#dbeafe" stroke="#cbd5e1"/><text x="54" y="161" font-size="22" font-weight="700" fill="#0f172a">A · Can it react in time?</text><text x="54" y="201" font-size="18" fill="#334155">One recording, one normal-speed run</text><text x="54" y="229" font-size="18" fill="#334155">Meaningful reaction before audio ends</text><text x="54" y="257" font-size="18" fill="#334155">Enforced no-look-ahead boundary</text><rect x="428" y="125" width="345" height="200" rx="14" fill="#ccfbf1" stroke="#cbd5e1"/><text x="446" y="161" font-size="22" font-weight="700" fill="#0f172a">B · Is the question right?</text><text x="446" y="201" font-size="18" fill="#334155">Proposed five-question challenge</text><text x="446" y="229" font-size="18" fill="#334155">Proposed repeated comparisons</text><text x="446" y="257" font-size="18" fill="#334155">Fidelity, persistence and timing</text><rect x="820" y="125" width="344" height="200" rx="14" fill="#fef3c7" stroke="#cbd5e1"/><text x="838" y="161" font-size="22" font-weight="700" fill="#0f172a">Separate · Does it help?</text><text x="838" y="201" font-size="18" fill="#334155">Air QA checks real capture</text><text x="838" y="229" font-size="18" fill="#334155">Live answering tests attention</text><text x="838" y="257" font-size="18" fill="#334155">Optional manual display comparison</text><path d="M386 225L423 225" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="36" y="385" font-size="20" fill="#0f172a">Passing A does not establish B. Passing B does not establish live usefulness.</text><text x="36" y="424" font-size="18" fill="#475569">First artifact: identify the recording, permitted inputs and one expected early reaction.</text></g></svg>
