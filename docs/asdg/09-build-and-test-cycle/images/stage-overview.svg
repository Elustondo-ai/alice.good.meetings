<rect x="344" y="48" width="272" height="94" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="480" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#0f172a">Code and companions</text>
