<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">State 6: confirmation pending, then uncertain</title><desc id="d">Live shows the submitted wording frozen and tagged confirming. A note says newer wording arrived. After five seconds without a result the feedback says confirmation uncertain and the button reads Retry confirmation.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif}</style>
<rect width="900" height="520" fill="green"/>
<text x="378.0" y="360" font-size="120" font-weight="bold" text-anchor="middle" fill="white">GOOD</text>
<rect x="422" y="8" width="470" height="262.4000000000001" rx="7" fill="#000" fill-opacity="0.8"/><text x="436" y="34.8" font-size="11.52" letter-spacing="1" fill="#fff" opacity="0.8">FOCUS QUESTION</text><text x="436" y="62.8" font-size="16" font-weight="bold" font-style="normal" fill="#fff" opacity="1">Tell me about your last two jobs and why</text><text x="436" y="83.6" font-size="16" font-weight="bold" font-style="normal" fill="#fff" opacity="1">you left the second one.</text><line x1="436" x2="878" y1="91.6" y2="91.6" stroke="#fff" stroke-opacity="0.25"/><text x="436" y="109.19999999999999" font-size="11.52" letter-spacing="1" fill="#fff" opacity="0.8">LIVE QUESTION<tspan dx="8" fill="#ffd54a" opacity="1">· confirming…</tspan></text><text x="448" y="137.2" font-size="16" font-weight="normal" font-style="italic" fill="#fff" opacity="1">What would you do differently in your</text><text x="448" y="158.0" font-size="16" font-weight="normal" font-style="italic" fill="#fff" opacity="1">next role?</text><rect x="436" y="121.99999999999999" width="3" height="41.60000000000001" fill="#ffd54a"/><text x="436" y="182.8" font-size="12.8" fill="#ffd54a" opacity="1">Newer wording arrived; review it after this result.</text><text x="436" y="204.40000000000003" font-size="12.8" fill="#fff" opacity="0.9">Confirmation uncertain: no reply from the server yet.</text><text x="436" y="221.20000000000005" font-size="12.8" fill="#fff" opacity="0.9">Retry to check.</text><rect x="436" y="232.40000000000006" width="173.76" height="28.0" rx="4" fill="#ffffff" opacity="1" stroke="#ffd54a" stroke-width="2"/><text x="448" y="251.60000000000005" font-size="13.6" font-weight="bold" fill="#111">Retry confirmation</text><rect x="617.76" y="232.40000000000006" width="107.2" height="28.0" rx="4" fill="#8a8a8a" opacity="0.55" stroke="none" stroke-width="2"/><text x="629.76" y="251.60000000000005" font-size="13.6" font-weight="normal" fill="#111">Clear live</text>
<rect x="8" y="486" width="262" height="26" rx="4" fill="#fff" fill-opacity="0.92"/>
<text x="18" y="504" font-size="13" font-weight="bold" fill="#333">MOCKUP · proposed, not implemented</text>
</svg>