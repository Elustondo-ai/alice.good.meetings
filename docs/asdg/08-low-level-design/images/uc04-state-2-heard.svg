<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">State 2: a question is heard</title><desc id="d">Live shows the interpreted question tagged new question while Focus is still empty. Confirm question is enabled.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif}</style>
<rect width="900" height="520" fill="green"/>
<text x="378.0" y="360" font-size="120" font-weight="bold" text-anchor="middle" fill="white">GOOD</text>
<rect x="422" y="8" width="470" height="181.6" rx="7" fill="#000" fill-opacity="0.8"/><text x="436" y="34.8" font-size="11.52" letter-spacing="1" fill="#fff" opacity="0.8">FOCUS QUESTION</text><text x="436" y="62.8" font-size="16" font-weight="normal" font-style="normal" fill="#fff" opacity="0.6">No focus question yet</text><line x1="436" x2="878" y1="70.8" y2="70.8" stroke="#fff" stroke-opacity="0.25"/><text x="436" y="88.39999999999999" font-size="11.52" letter-spacing="1" fill="#fff" opacity="0.8">LIVE QUESTION<tspan dx="8" fill="#ffd54a" opacity="1">· new question</tspan></text><text x="448" y="116.39999999999999" font-size="16" font-weight="normal" font-style="italic" fill="#fff" opacity="1">Tell me about your last two jobs and why</text><text x="448" y="137.2" font-size="16" font-weight="normal" font-style="italic" fill="#fff" opacity="1">you left the second one.</text><rect x="436" y="101.19999999999999" width="3" height="41.599999999999994" fill="#ffd54a"/><rect x="436" y="151.6" width="157.12" height="28.0" rx="4" fill="#ffffff" opacity="1" stroke="#ffd54a" stroke-width="2"/><text x="448" y="170.79999999999998" font-size="13.6" font-weight="bold" fill="#111">Confirm question</text><rect x="601.12" y="151.6" width="107.2" height="28.0" rx="4" fill="#e6e6e6" opacity="1" stroke="none" stroke-width="2"/><text x="613.12" y="170.79999999999998" font-size="13.6" font-weight="normal" fill="#111">Clear live</text>
<rect x="8" y="486" width="262" height="26" rx="4" fill="#fff" fill-opacity="0.92"/>
