<rect x="422" y="8" width="470" height="203.20000000000002" rx="7" fill="#000" fill-opacity="0.8"/><text x="436" y="34.8" font-size="11.52" letter-spacing="1" fill="#fff" opacity="0.8">FOCUS QUESTION<tspan dx="8" fill="#ffd54a" opacity="1">· last known, not live</tspan></text><text x="436" y="62.8" font-size="16" font-weight="bold" font-style="normal" fill="#fff" opacity="0.6">Tell me about your last two jobs and why</text><text x="436" y="83.6" font-size="16" font-weight="bold" font-style="normal" fill="#fff" opacity="0.6">you left the second one.</text><line x1="436" x2="878" y1="91.6" y2="91.6" stroke="#fff" stroke-opacity="0.25"/><text x="436" y="109.19999999999999" font-size="11.52" letter-spacing="1" fill="#fff" opacity="0.8">LIVE QUESTION</text><text x="436" y="137.2" font-size="16" font-weight="normal" font-style="italic" fill="#fff" opacity="0.6">Not listening</text><rect x="436" y="151.6" width="157.12" height="28.0" rx="4" fill="#8a8a8a" opacity="0.55" stroke="none" stroke-width="2"/><text x="448" y="170.79999999999998" font-size="13.6" font-weight="bold" fill="#111">Confirm question</text><rect x="601.12" y="151.6" width="107.2" height="28.0" rx="4" fill="#8a8a8a" opacity="0.55" stroke="none" stroke-width="2"/><text x="613.12" y="170.79999999999998" font-size="13.6" font-weight="normal" fill="#111">Clear live</text><text x="436" y="196.4" font-size="12.8" fill="#fff" opacity="0.7">Start listening to continue.</text>
