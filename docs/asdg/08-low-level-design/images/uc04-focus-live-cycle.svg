<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="t d">
  <title id="t">The Focus and Live question cycle</title>
  <desc id="d">Speech fills the Live question automatically. Only Pablo pressing Confirm question copies the exact Live wording into the Focus question. Live then clears and refills only from later speech. While Pablo answers, Focus stays fixed and Live may change. A new question in Live starts the cycle again. Nothing automatic ever writes Focus.</desc>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#365b70" stroke-width="2.3"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #203b4a; }
      .h { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .b { font-size: 16px; text-anchor: middle; }
      .l { fill: none; stroke: #365b70; stroke-width: 2.4; marker-end: url(#a); }
      .live { fill: #fff8db; stroke: #c9a227; stroke-width: 2; }
      .focus { fill: #e3f1ec; stroke: #26716c; stroke-width: 2; }
      .user { fill: #e8eef7; stroke: #3d5f8f; stroke-width: 2; }
    </style>
  </defs>
  <rect width="980" height="470" fill="#fbfcfd"/>
  <text x="40" y="44" font-size="24" font-weight="700">Two areas, one deliberate step between them</text>
  <rect x="40" y="80" width="400" height="110" rx="10" class="live"/>
  <text x="240" y="115" class="h">1 · A question is heard</text>
  <text x="240" y="143" class="b">The agent's interpretation fills LIVE.</text>
  <text x="240" y="167" class="b">Updated automatically from speech.</text>
  <rect x="540" y="80" width="400" height="110" rx="10" class="user"/>
  <text x="740" y="115" class="h">2 · Pablo presses Confirm question</text>
  <text x="740" y="143" class="b">The exact LIVE wording on screen</text>
  <text x="740" y="167" class="b">is copied into FOCUS.</text>
  <rect x="540" y="270" width="400" height="110" rx="10" class="focus"/>
  <text x="740" y="305" class="h">3 · FOCUS is set, LIVE clears</text>
  <text x="740" y="333" class="b">LIVE refills only from speech</text>
  <text x="740" y="357" class="b">heard after the confirmation.</text>
  <rect x="40" y="270" width="400" height="110" rx="10" class="focus"/>
  <text x="240" y="305" class="h">4 · Pablo answers</text>
  <text x="240" y="333" class="b">FOCUS stays fixed. LIVE may show</text>
  <text x="240" y="357" class="b">a rephrasing or a new question.</text>
  <path d="M440 135 H532" class="l"/>
  <path d="M740 190 V262" class="l"/>
  <path d="M540 325 H448" class="l"/>
  <path d="M240 270 V198" class="l"/>
  <text x="250" y="236" font-size="15" fill="#526b79">new question in LIVE</text>
  <text x="40" y="430" font-size="17" font-weight="700" fill="#26716c">Rule: nothing automatic ever writes FOCUS; only a confirmed LIVE version does.</text>
</svg>
