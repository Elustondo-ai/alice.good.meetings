<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Two source kinds become one verified snapshot and one installation record</title>
  <desc id="d">A local clone of the canonical repository at an exact commit or tag is the primary source and is verified against Git object hashes. An unpacked package, including a GitHub Download ZIP, is the fallback and is verified only against its own manifest. Both produce the same file snapshot. The installation record stores the version, catalogue hash, source kind, commit when known and every file hash, which later updates use as their baseline.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker></defs>
  <rect width="720" height="260" fill="#ffffff"/>
  <rect x="20" y="30" width="220" height="82" rx="8" fill="#e3f9e5" stroke="#3f9142" stroke-width="2"/>
  <text x="130" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">Git clone + commit/tag</text>
  <text x="130" y="74" text-anchor="middle" font-size="11" fill="#3e4c59">primary: VERIFIED_GIT</text>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="#3e4c59">origin, HEAD, blob hashes</text>
  <rect x="20" y="140" width="220" height="82" rx="8" fill="#fffbea" stroke="#c99a2e" stroke-width="2"/>
  <text x="130" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">Unpacked package / ZIP</text>
  <text x="130" y="184" text-anchor="middle" font-size="11" fill="#3e4c59">fallback: MANIFEST_PACKAGE</text>
  <text x="130" y="202" text-anchor="middle" font-size="11" fill="#3e4c59">manifest only; commit unknown</text>
  <rect x="290" y="85" width="160" height="82" rx="10" fill="#f4f6f8" stroke="#7b8794"/>
  <text x="370" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">One snapshot</text>
  <text x="370" y="134" text-anchor="middle" font-size="11" fill="#3e4c59">package file list</text>
  <text x="370" y="152" text-anchor="middle" font-size="11" fill="#3e4c59">+ SHA-256 per file</text>
  <path d="M240,71 L286,110" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M240,181 L286,142" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="500" y="50" width="200" height="152" rx="10" fill="#e6f6ff" stroke="#2680c2" stroke-width="2"/>
  <text x="600" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">.asdg/installation.json</text>
  <text x="600" y="100" text-anchor="middle" font-size="11" fill="#3e4c59">current: version, catalogue</text>
  <text x="600" y="118" text-anchor="middle" font-size="11" fill="#3e4c59">source kind, commit, tag</text>
  <text x="600" y="136" text-anchor="middle" font-size="11" fill="#3e4c59">files + managed adapters</text>
  <text x="600" y="160" text-anchor="middle" font-size="11" fill="#3e4c59">history: init · update ·</text>
  <text x="600" y="178" text-anchor="middle" font-size="11" fill="#3e4c59">replace · adopt</text>
  <path d="M450,126 L496,126" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
</svg>
