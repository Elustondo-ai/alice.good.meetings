<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Root AGENTS.md: managed bootstrap first, project guidance after</title>
  <desc id="d">The root AGENTS.md starts with a seven-line ASDG bootstrap generated by setup. It requires reading asdg/AGENTS.md, which links the startup sources, the implementation gate and ASDG Admin. Below the block, project-owned SpeakerCoach guidance links to purpose, architecture, POC, evaluation and status documents.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker></defs>
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="140" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Root AGENTS.md</text>
  <rect x="30" y="40" width="220" height="300" rx="10" fill="#f4f6f8" stroke="#7b8794"/>
  <rect x="44" y="54" width="192" height="104" rx="8" fill="#e6f6ff" stroke="#2680c2" stroke-width="2"/>
  <text x="140" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">ASDG bootstrap</text>
  <text x="140" y="97" text-anchor="middle" font-size="11" fill="#3e4c59">generated by setup, 7 lines</text>
  <text x="140" y="114" text-anchor="middle" font-size="11" fill="#3e4c59">read asdg/AGENTS.md first;</text>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#3e4c59">missing source blocks work;</text>
  <text x="140" y="146" text-anchor="middle" font-size="11" fill="#3e4c59">read-only diagnosis allowed</text>
  <rect x="44" y="176" width="192" height="148" rx="8" fill="#e3f9e5" stroke="#3f9142" stroke-width="2"/>
  <text x="140" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">SpeakerCoach guidance</text>
  <text x="140" y="219" text-anchor="middle" font-size="11" fill="#3e4c59">project-owned, kept byte-for-byte</text>
  <text x="140" y="240" text-anchor="middle" font-size="11" fill="#3e4c59">what it is and what is here</text>
  <text x="140" y="257" text-anchor="middle" font-size="11" fill="#3e4c59">what to read first</text>
  <text x="140" y="274" text-anchor="middle" font-size="11" fill="#3e4c59">where to look</text>
  <text x="140" y="291" text-anchor="middle" font-size="11" fill="#3e4c59">sourced project constraints</text>

  <rect x="330" y="54" width="170" height="60" rx="8" fill="#ffffff" stroke="#2680c2"/>
  <text x="415" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">asdg/AGENTS.md</text>
  <text x="415" y="99" text-anchor="middle" font-size="11" fill="#3e4c59">shared methodology entry</text>
  <path d="M236,90 L326,86" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="540" y="22" width="160" height="44" rx="7" fill="#ffffff" stroke="#7b8794"/>
  <text x="620" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2933">Startup sources</text>
