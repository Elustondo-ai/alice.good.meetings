<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Git preconditions around preview and apply</title>
  <desc id="d">Before preview, the target working tree must be clean and settled, the Git source must be clean at the selected commit, and ignored-file collisions are checked separately. The preview produces a plan token fingerprinting HEAD, branch, status and planned file hashes. Before apply, every check is repeated; any change invalidates the plan. Apply writes only planned paths and never commits, stashes, resets or cleans. Afterwards git status lists exactly the planned paths for the human to review and commit. Any failure reports an exact code and corrective action.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker></defs>
  <rect width="720" height="270" fill="#ffffff"/>
  <rect x="14" y="30" width="150" height="130" rx="8" fill="#e3f9e5" stroke="#3f9142" stroke-width="2"/>
  <text x="89" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Before preview</text>
  <text x="89" y="76" text-anchor="middle" font-size="11" fill="#3e4c59">target clean, settled</text>
  <text x="89" y="96" text-anchor="middle" font-size="11" fill="#3e4c59">source clean at commit</text>
  <text x="89" y="116" text-anchor="middle" font-size="11" fill="#3e4c59">ignored collisions</text>
  <text x="89" y="136" text-anchor="middle" font-size="11" fill="#3e4c59">checked separately</text>
  <rect x="196" y="30" width="150" height="130" rx="8" fill="#e6f6ff" stroke="#2680c2" stroke-width="2"/>
  <text x="271" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Preview + token</text>
  <text x="271" y="76" text-anchor="middle" font-size="11" fill="#3e4c59">fingerprint: HEAD,</text>
  <text x="271" y="96" text-anchor="middle" font-size="11" fill="#3e4c59">branch, status,</text>
  <text x="271" y="116" text-anchor="middle" font-size="11" fill="#3e4c59">planned file hashes</text>
  <text x="271" y="136" text-anchor="middle" font-size="11" fill="#3e4c59">human approves</text>
  <rect x="378" y="30" width="150" height="130" rx="8" fill="#e3f9e5" stroke="#3f9142" stroke-width="2"/>
  <text x="453" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Before apply</text>
  <text x="453" y="76" text-anchor="middle" font-size="11" fill="#3e4c59">repeat every check</text>
  <text x="453" y="96" text-anchor="middle" font-size="11" fill="#3e4c59">recompute the plan</text>
  <text x="453" y="116" text-anchor="middle" font-size="11" fill="#3e4c59">any change:</text>
  <text x="453" y="136" text-anchor="middle" font-size="11" fill="#3e4c59">token invalid</text>
  <rect x="560" y="30" width="146" height="130" rx="8" fill="#fffbea" stroke="#c99a2e" stroke-width="2"/>
  <text x="633" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">After apply</text>
  <text x="633" y="76" text-anchor="middle" font-size="11" fill="#3e4c59">only planned paths</text>
  <text x="633" y="96" text-anchor="middle" font-size="11" fill="#3e4c59">changed; HEAD same</text>
  <text x="633" y="116" text-anchor="middle" font-size="11" fill="#3e4c59">human reviews</text>
  <text x="633" y="136" text-anchor="middle" font-size="11" fill="#3e4c59">and commits</text>
  <path d="M164,95 L192,95" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M346,95 L374,95" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M528,95 L556,95" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="14" y="190" width="514" height="62" rx="8" fill="#ffe3e3" stroke="#cf1124" stroke-width="2"/>
  <text x="271" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Any failure: exact Git code + corrective action, no writes</text>
  <text x="271" y="236" text-anchor="middle" font-size="11" fill="#3e4c59">ASDG never commits, stashes, resets, cleans or discards user files</text>
  <path d="M89,160 L89,186" stroke="#cf1124" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M453,160 L453,186" stroke="#cf1124" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
</svg>
