<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">ASDG installation lifecycle: init, update and replace share one engine</title>
  <desc id="d">Three commands: init for new installations only, update for a controlled revision with three-way conflict detection, and replace for an explicit whole-folder swap. All three first require a clean Git target and source, then run the same preview, approval token, Git recheck and atomic apply, leaving changes uncommitted for review. They write the methodology folder, client adapters and an installation record. Project lifecycle state, sprint state, review history and project documents are never rewritten.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker></defs>
  <rect width="720" height="340" fill="#ffffff"/>

  <rect x="20" y="30" width="190" height="62" rx="8" fill="#e6f6ff" stroke="#2680c2" stroke-width="2"/>
  <text x="115" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">asdg init</text>
  <text x="115" y="74" text-anchor="middle" font-size="11" fill="#3e4c59">new only; fails if initialized</text>
  <rect x="20" y="110" width="190" height="62" rx="8" fill="#e6f6ff" stroke="#2680c2" stroke-width="2"/>
  <text x="115" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">asdg update</text>
  <text x="115" y="154" text-anchor="middle" font-size="11" fill="#3e4c59">three-way; conflicts block</text>
  <rect x="20" y="190" width="190" height="62" rx="8" fill="#e6f6ff" stroke="#2680c2" stroke-width="2"/>
  <text x="115" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">asdg replace</text>
  <text x="115" y="234" text-anchor="middle" font-size="11" fill="#3e4c59">whole swap; losses listed</text>

  <rect x="260" y="60" width="190" height="170" rx="10" fill="#f4f6f8" stroke="#7b8794"/>
  <text x="355" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">Shared engine</text>
  <text x="355" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#cf1124">clean Git target + source</text>
  <text x="355" y="128" text-anchor="middle" font-size="11" fill="#3e4c59">read source (Git or package)</text>
  <text x="355" y="148" text-anchor="middle" font-size="11" fill="#3e4c59">compatibility check</text>
  <text x="355" y="168" text-anchor="middle" font-size="11" fill="#3e4c59">preview + plan token</text>
  <text x="355" y="188" text-anchor="middle" font-size="11" fill="#3e4c59">recheck Git, atomic apply</text>
  <text x="355" y="208" text-anchor="middle" font-size="11" fill="#3e4c59">left uncommitted for review</text>
  <path d="M210,61 L256,100" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M210,141 L256,141" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M210,221 L256,182" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <text x="600" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Written</text>
  <rect x="500" y="34" width="200" height="40" rx="7" fill="#ffffff" stroke="#2680c2"/>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="#1f2933">asdg/ methodology files</text>
  <rect x="500" y="82" width="200" height="40" rx="7" fill="#ffffff" stroke="#2680c2"/>
  <text x="600" y="106" text-anchor="middle" font-size="11" fill="#1f2933">client adapters, bootstrap</text>
  <rect x="500" y="130" width="200" height="40" rx="7" fill="#ffffff" stroke="#2680c2"/>
  <text x="600" y="154" text-anchor="middle" font-size="11" fill="#1f2933">.asdg/installation.json (new)</text>
  <path d="M450,110 L496,56" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M450,130 L496,102" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M450,150 L496,150" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="260" y="252" width="440" height="72" rx="10" fill="#e3f9e5" stroke="#3f9142" stroke-width="2"/>
  <text x="480" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Never rewritten by any of the three</text>
  <text x="480" y="294" text-anchor="middle" font-size="11" fill="#3e4c59">lifecycle.json · sprint.json · sprint-closeouts/ · review history (append only)</text>
  <text x="480" y="311" text-anchor="middle" font-size="11" fill="#3e4c59">docs/asdg/ evidence · project text in AGENTS.md · client selection</text>
</svg>
