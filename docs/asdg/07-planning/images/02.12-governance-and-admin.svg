<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Session roles: Governance default, specialists and ASDG Admin</title>
  <desc id="d">A new session loads its sources and starts under 00 Governance; a failed load blocks. Explicit selection moves to a specialist, and clearing returns to Governance. Only an explicit human selection moves to ASDG Admin, which changes rules within a human-authorized scope. Every successful transition synchronizes the session title.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker></defs>
  <rect width="720" height="330" fill="#ffffff"/>

  <rect x="20" y="120" width="130" height="60" rx="8" fill="#f4f6f8" stroke="#7b8794"/>
  <text x="85" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">New session</text>
  <text x="85" y="164" text-anchor="middle" font-size="11" fill="#3e4c59">load required sources</text>

  <rect x="20" y="240" width="130" height="60" rx="8" fill="#ffe3e3" stroke="#c53030"/>
  <text x="85" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Role Unknown</text>
  <text x="85" y="283" text-anchor="middle" font-size="11" fill="#3e4c59">BLOCKED: bootstrap</text>
  <path d="M85,180 L85,236" stroke="#c53030" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="92" y="214" font-size="11" fill="#c53030">sources missing</text>

  <rect x="230" y="110" width="170" height="80" rx="10" fill="#e6f6ff" stroke="#2680c2" stroke-width="2"/>
  <text x="315" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">00 Governance</text>
  <text x="315" y="159" text-anchor="middle" font-size="11" fill="#3e4c59">default project role</text>
  <text x="315" y="175" text-anchor="middle" font-size="11" fill="#3e4c59">routes, checks gates, proposes</text>
  <path d="M150,150 L226,150" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="500" y="30" width="200" height="70" rx="10" fill="#e3f9e5" stroke="#3f9142"/>
  <text x="600" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Specialist 01–12</text>
  <text x="600" y="78" text-anchor="middle" font-size="11" fill="#3e4c59">its own delivery mandate</text>
  <path d="M400,130 L496,80" stroke="#3e4c59" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="398" y="84" font-size="11" fill="#3e4c59">explicit selection</text>
  <path d="M500,92 L404,142" stroke="#3e4c59" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <text x="452" y="140" font-size="11" fill="#3e4c59">clear</text>

  <rect x="500" y="200" width="200" height="80" rx="10" fill="#fff3c4" stroke="#b44d12" stroke-width="2"/>
  <text x="600" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">ASDG Admin</text>
  <text x="600" y="247" text-anchor="middle" font-size="11" fill="#3e4c59">changes ASDG rules only within</text>
  <text x="600" y="263" text-anchor="middle" font-size="11" fill="#3e4c59">a human-authorized scope</text>
  <path d="M400,172 L496,224" stroke="#b44d12" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="372" y="222" font-size="11" fill="#b44d12">explicit human</text>
  <text x="372" y="236" font-size="11" fill="#b44d12">selection only</text>
  <path d="M500,262 L404,184" stroke="#3e4c59" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <text x="430" y="275" font-size="11" fill="#3e4c59">clear</text>

  <text x="360" y="318" text-anchor="middle" font-size="12" fill="#1f2933">Each successful transition syncs the session title; any role may propose rule changes.</text>
</svg>
