<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Current implementation: the page and its local service</title>
<desc id="desc">Source-inspected behavior at revision 7d60c0f. On the MacBook, the web page computes the GOOD, LAND IT, STOP cue from the microphone by itself and shows the Focus and Live questions. It sends audio packets and question controls to a local service, which forwards audio to OpenAI live transcription, asks a reasoning model for a proposal and returns validated state revisions to the page.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#316d9c"/></marker></defs>
