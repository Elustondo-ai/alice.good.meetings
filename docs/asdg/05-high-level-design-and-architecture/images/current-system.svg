<text x="182" y="326" font-size="16" fill="#183249">audio packets, controls</text>
<path d="M 450 360 L 450 289" fill="none" stroke="#316d9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="462" y="326" font-size="16" fill="#183249">state</text>
