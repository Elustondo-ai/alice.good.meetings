<text x="64" y="393" font-size="21" fill="#183249" font-weight="700">Local service · poc/ on 127.0.0.1</text>
<text x="64" y="426" font-size="17" fill="#183249">Audio intake and transcription adapter; holds the key</text>
<text x="64" y="458" font-size="17" fill="#183249">Interview agent: proposes a reply, a phase and Live</text>
<text x="64" y="490" font-size="17" fill="#183249">State controller: validates proposals, owns the state</text>
<text x="64" y="522" font-size="17" fill="#183249">Only Confirm question writes the Focus question</text>
