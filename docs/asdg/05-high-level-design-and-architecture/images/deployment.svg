<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
<title id="title">Alice.Good.Meetings: where it runs</title>
<desc id="desc">Proposed architecture: the MacBook contains the web page and a local service. The service holds audio intake, the interview agent, the answer generator, the preparation package read from disk and the state controller. Separate cloud APIs provide live transcription and model reasoning. Audio, recent transcript, the Focus question and the preparation package text leave the Mac; validated display updates return to the page.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#316d9c"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect width="900" height="700" fill="#f6f8fc"/>
<text x="30" y="40" font-size="28" fill="#183249" font-weight="700">Alice.Good.Meetings: where it runs</text>
<text x="30" y="70" font-size="18" fill="#51677b">Proposed architecture · one local service, two kinds of model request</text>
<rect x="20" y="100" width="560" height="560" rx="14" fill="#eaf2fb" stroke="#c4d3e2" stroke-width="2"/>
<rect x="620" y="100" width="260" height="560" rx="14" fill="#eef5ef" stroke="#bdd4c1" stroke-width="2"/>
<text x="44" y="135" font-size="23" fill="#183249" font-weight="700">Pablo's MacBook</text>
<text x="640" y="135" font-size="23" fill="#28553c" font-weight="700">OpenAI cloud APIs</text>
<rect x="44" y="155" width="512" height="105" rx="14" fill="#ffffff" stroke="#c4d3e2" stroke-width="2"/>
<text x="64" y="188" font-size="21" fill="#183249" font-weight="700">Alice.Good.Meetings web page</text>
<text x="64" y="218" font-size="17" fill="#183249">Microphone · cue · Focus and Live questions</text>
<text x="64" y="244" font-size="17" fill="#183249">Proposed answer: bullet card and details area</text>
<path d="M 170 260 L 170 331" fill="none" stroke="#316d9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="182" y="301" font-size="16" fill="#183249">audio, controls</text>
<path d="M 450 335 L 450 264" fill="none" stroke="#316d9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="462" y="301" font-size="16" fill="#183249">updates</text>
<rect x="44" y="335" width="512" height="300" rx="14" fill="#ffffff" stroke="#c4d3e2" stroke-width="2"/>
<text x="64" y="368" font-size="21" fill="#183249" font-weight="700">Local Alice.Good.Meetings service</text>
<text x="64" y="402" font-size="17" fill="#183249">Audio intake and transcription adapter</text>
<text x="64" y="436" font-size="17" fill="#183249">Interview agent: proposes the Live question</text>
<text x="64" y="470" font-size="17" fill="#183249" font-weight="700">Answer generator: bullets and details (new)</text>
<text x="64" y="504" font-size="17" fill="#183249" font-weight="700">Preparation package: his documents, read from disk (new)</text>
<text x="64" y="545" font-size="19" fill="#183249" font-weight="700">State controller</text>
<text x="64" y="573" font-size="17" fill="#183249">Owns accepted state; ties each answer to its Focus version</text>
<text x="64" y="607" font-size="15" fill="#51677b">Serves the page; the key and the package text never reach it.</text>
<rect x="640" y="335" width="220" height="80" rx="14" fill="#ffffff" stroke="#bdd4c1" stroke-width="2"/>
<text x="750" y="369" font-size="20" text-anchor="middle" fill="#28553c" font-weight="700">Live transcription</text>
<text x="750" y="396" font-size="16" text-anchor="middle" fill="#183249">Speech → text</text>
<path d="M 556 357 L 636 357" fill="none" stroke="#316d9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="598" y="348" font-size="15" text-anchor="middle" fill="#183249">audio</text>
<path d="M 640 397 L 560 397" fill="none" stroke="#316d9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="598" y="388" font-size="15" text-anchor="middle" fill="#183249">text</text>
<rect x="640" y="445" width="220" height="190" rx="14" fill="#ffffff" stroke="#bdd4c1" stroke-width="2"/>
<text x="750" y="479" font-size="20" text-anchor="middle" fill="#28553c" font-weight="700">Reasoning model</text>
<text x="750" y="508" font-size="16" text-anchor="middle" fill="#183249">Interprets the interview</text>
<text x="750" y="598" font-size="16" text-anchor="middle" fill="#183249">Prepares an answer</text>
<path d="M 556 470 L 636 470" fill="none" stroke="#316d9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="598" y="461" font-size="15" text-anchor="middle" fill="#183249">snapshot</text>
<path d="M 640 505 L 560 505" fill="none" stroke="#316d9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="598" y="496" font-size="15" text-anchor="middle" fill="#183249">proposal</text>
<path d="M 556 565 L 636 565" fill="none" stroke="#316d9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="598" y="556" font-size="15" text-anchor="middle" fill="#183249">question</text>
<path d="M 640 600 L 560 600" fill="none" stroke="#316d9c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="598" y="591" font-size="15" text-anchor="middle" fill="#183249">answer</text>
<text x="640" y="180" font-size="16" fill="#51677b">Leaves the Mac: audio,</text>
<text x="640" y="204" font-size="16" fill="#51677b">recent transcript, the</text>
<text x="640" y="228" font-size="16" fill="#51677b">Focus question and the</text>
<text x="640" y="252" font-size="16" fill="#51677b">preparation package text.</text>
<text x="30" y="685" font-size="17" fill="#51677b">Models propose; the local controller validates and decides what the page shows.</text>
</g>
</svg>
