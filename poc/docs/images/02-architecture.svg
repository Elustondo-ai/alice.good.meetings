<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
<title id="title">Three places, clear ownership</title><desc id="desc">Browser modules capture and display; one local service owns transport, session state and the Agents SDK; OpenAI separately transcribes audio and runs model inference.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1c3045}.node{font-size:22px;font-weight:700}.body{font-size:18px}.label{font-size:17px;fill:#465d72}.zone{font-size:17px;font-weight:700;letter-spacing:1px}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linejoin:round}.heading{font-size:26px;font-weight:700}.kicker{font-size:13px;fill:#61778d;letter-spacing:1.6px}</style>
<rect width="900" height="590" rx="16" fill="#f8fafc"/>
<text x="24" y="29" class="kicker">SPEAKERCOACH · WORKING POC</text>
<text x="24" y="64" class="heading">Three places, clear ownership</text>
<rect x="16" y="90" width="264" height="455" rx="16" fill="#e7f0ff" opacity=".38"/>
<text x="32" y="118" class="zone">BROWSER</text><rect x="306" y="90" width="294" height="455" rx="16" fill="#e4f5ee" opacity=".38"/>
<text x="322" y="118" class="zone">LOCAL NODE SERVICE</text><rect x="626" y="90" width="258" height="455" rx="16" fill="#f0eaff" opacity=".38"/>
<text x="642" y="118" class="zone">OPENAI CLOUD</text><g><rect x="32" y="153" width="232" height="100" rx="12" fill="#e7f0ff" stroke="#4275bb" stroke-width="1.5"/>
<text x="48" y="184" class="node">app.js + index.html</text>
<text x="48" y="212" class="body">Local meter and display</text></g><g><rect x="32" y="355" width="232" height="100" rx="12" fill="#e7f0ff" stroke="#4275bb" stroke-width="1.5"/>
<text x="48" y="386" class="node">audio-worklet.js</text>
<text x="48" y="414" class="body">100 ms PCM packets</text></g><g><rect x="322" y="153" width="262" height="100" rx="12" fill="#e4f5ee" stroke="#338064" stroke-width="1.5"/>
<text x="338" y="184" class="node">server.mjs</text>
<text x="338" y="212" class="body">HTTP + WebSockets</text></g><g><rect x="322" y="303" width="262" height="90" rx="12" fill="#e4f5ee" stroke="#338064" stroke-width="1.5"/>
<text x="338" y="334" class="node">session.mjs</text>
<text x="338" y="362" class="body">Snapshots + accepted state</text></g><g><rect x="322" y="443" width="262" height="80" rx="12" fill="#e4f5ee" stroke="#338064" stroke-width="1.5"/>
<text x="338" y="474" class="node">agent.mjs</text>
<text x="338" y="502" class="body">Agents SDK runner</text></g><g><rect x="642" y="153" width="226" height="100" rx="12" fill="#f0eaff" stroke="#8262ad" stroke-width="1.5"/>
<text x="658" y="184" class="node">Transcription</text>
<text x="658" y="212" class="body">Audio → text</text></g><g><rect x="642" y="443" width="226" height="80" rx="12" fill="#f0eaff" stroke="#8262ad" stroke-width="1.5"/>
<text x="658" y="474" class="node">Reasoning model</text>
<text x="658" y="502" class="body">Snapshot → proposal</text></g><path d="M148 253 V355" class="edge" marker-end="url(#arrow)"/>
<text x="160" y="313" class="label">capture</text><path d="M264 405 H292 V203 H322" class="edge" marker-end="url(#arrow)"/>
<path d="M584 184 H642" class="edge" marker-end="url(#arrow)"/>
<text x="590" y="173" class="label">audio</text><path d="M642 228 H614 V280 H453 V303" class="edge" marker-end="url(#arrow)"/>
<text x="556" y="274" class="label">text</text><path d="M322 344 H292 V230 H264" class="edge" marker-end="url(#arrow)"/>
<path d="M453 393 V443" class="edge" marker-end="url(#arrow)"/>
<path d="M584 466 H642" class="edge" marker-end="url(#arrow)"/>
<path d="M642 506 H584" class="edge" marker-end="url(#arrow)"/>
<text x="24" y="570" class="label">Blue = browser   ·   Green = one local process   ·   Purple = cloud inference</text>
