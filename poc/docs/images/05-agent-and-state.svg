<svg xmlns="http://www.w3.org/2000/svg" width="900" height="525" viewBox="0 0 900 525" role="img" aria-labelledby="title desc">
<title id="title">Interpretation is a proposal</title><desc id="desc">A bounded snapshot is reasoned over once. Controller checks publish valid revisions, preserve established questions during answers and reject obsolete proposals.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1c3045}.node{font-size:22px;font-weight:700}.body{font-size:18px}.label{font-size:17px;fill:#465d72}.zone{font-size:17px;font-weight:700;letter-spacing:1px}.edge{fill:none;stroke:#52677b;stroke-width:2;stroke-linejoin:round}.heading{font-size:26px;font-weight:700}.kicker{font-size:13px;fill:#61778d;letter-spacing:1.6px}</style>
<rect width="900" height="525" rx="16" fill="#f8fafc"/>
<text x="24" y="29" class="kicker">SPEAKERCOACH · WORKING POC</text>
<text x="24" y="64" class="heading">Interpretation is a proposal</text>
<g><rect x="24" y="105" width="260" height="116" rx="12" fill="#e4f5ee" stroke="#338064" stroke-width="1.5"/>
<text x="40" y="136" class="node">Bounded snapshot</text>
<text x="40" y="164" class="body">Recent text + current state</text>
<text x="40" y="188" class="body">Session, revision, cutoff</text></g><g><rect x="320" y="105" width="260" height="116" rx="12" fill="#f0eaff" stroke="#8262ad" stroke-width="1.5"/>
<text x="336" y="136" class="node">One model call</text>
<text x="336" y="164" class="body">Agent + Runner</text>
<text x="336" y="188" class="body">New input remains pending</text></g><g><rect x="616" y="105" width="260" height="116" rx="12" fill="#fff2d8" stroke="#b88930" stroke-width="1.5"/>
<text x="632" y="136" class="node">Controller checks</text>
<text x="632" y="164" class="body">Shape, revision, citations</text>
<text x="632" y="188" class="body">Corrected text and phase</text></g><path d="M284 163 H320" class="edge" marker-end="url(#arrow)"/>
<path d="M580 163 H616" class="edge" marker-end="url(#arrow)"/>
<g><rect x="616" y="325" width="260" height="116" rx="12" fill="#e4f5ee" stroke="#338064" stroke-width="1.5"/>
<text x="632" y="356" class="node">Accepted state</text>
<text x="632" y="384" class="body">Revision + phase + reply</text>
<text x="632" y="408" class="body">Question stays in ANSWER</text></g><g><rect x="24" y="325" width="260" height="116" rx="12" fill="#e7f0ff" stroke="#4275bb" stroke-width="1.5"/>
<text x="40" y="356" class="node">Browser update</text>
<text x="40" y="384" class="body">Increasing revisions only</text>
<text x="40" y="408" class="body">Render acknowledgement</text></g><g><rect x="320" y="325" width="260" height="116" rx="12" fill="#eef2f6" stroke="#76879c" stroke-width="1.5"/>
<text x="336" y="356" class="node">Rejected proposal</text>
<text x="336" y="384" class="body">Keep the previous result</text>
<text x="336" y="408" class="body">Show agent status</text></g><path d="M746 221 V325" class="edge" marker-end="url(#arrow)"/>
<text x="760" y="279" class="label">accept</text><path d="M685 221 V269 H450 V325" class="edge" marker-end="url(#arrow)"/>
<text x="492" y="261" class="label">reject</text><path d="M616 415 H596 V475 H154 V441" class="edge" marker-end="url(#arrow)"/>
<text x="24" y="510" class="label">Audio continues while reasoning runs. Stop aborts work and suppresses late output.</text>
</svg>
