<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="t d">
  <title id="t">Package, log and screen data flow</title>
  <desc id="d">The page uploads files to the service, which keeps the package in memory; the controller feeds the page its messages and one log writer appends events to a file that Download log fetches.</desc>
  <style>.b{fill:#fff;stroke:#555;stroke-width:1.5}.t{font:12px sans-serif;fill:#222}.h{font:700 13px sans-serif;fill:#111}.l{stroke:#555;stroke-width:1.5;fill:none}</style>
  <rect width="720" height="260" fill="#f6f6f6"/>
  <rect class="b" x="20" y="20" width="170" height="60" rx="6"/><text class="h" x="36" y="45">Page</text><text class="t" x="36" y="64">screen, keys, Upload, Download</text>
  <rect class="b" x="270" y="20" width="200" height="60" rx="6"/><text class="h" x="286" y="45">Service</text><text class="t" x="286" y="64">package in memory, controller</text>
  <rect class="b" x="540" y="20" width="160" height="60" rx="6"/><text class="h" x="556" y="45">OpenAI</text><text class="t" x="556" y="64">reader call, bullets only</text>
  <rect class="b" x="270" y="160" width="200" height="60" rx="6"/><text class="h" x="286" y="185">Log writer</text><text class="t" x="286" y="204">appends to poc/logs/</text>
  <line class="l" x1="190" y1="40" x2="270" y2="40"/><text class="t" x="196" y="34">PUT/DELETE package</text>
  <line class="l" x1="270" y1="62" x2="190" y2="62"/><text class="t" x="196" y="76">answer, proposed, transcript</text>
  <line class="l" x1="470" y1="50" x2="540" y2="50"/>
  <line class="l" x1="370" y1="80" x2="370" y2="160"/><text class="t" x="378" y="125">events</text>
  <line class="l" x1="270" y1="190" x2="105" y2="190"/><line class="l" x1="105" y1="190" x2="105" y2="80"/><text class="t" x="120" y="180">GET /log</text>
</svg>
