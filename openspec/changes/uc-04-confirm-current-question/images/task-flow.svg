<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Build and verify at each boundary</title><desc id="desc">Controller and reasoner changes precede transport, browser controls and end-to-end evidence. Each implementation group includes its own tests and documentation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#46617d"/></marker></defs>
<style>text{font:16px Arial,sans-serif;fill:#19324a}.small{font-size:14px}.heading{font-size:21px;font-weight:bold}</style>
<rect width="760" height="300" rx="14" fill="#f7f9fc"/>
<text x="24" y="34" class="heading">Build and verify at each boundary</text>
<rect x="20" y="100" width="155" height="95" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="97.5" y="142.5" text-anchor="middle">Controller</text>
<text x="97.5" y="162.5" text-anchor="middle">and reasoner</text>
<rect x="205" y="100" width="155" height="95" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="282.5" y="142.5" text-anchor="middle">Control</text>
<text x="282.5" y="162.5" text-anchor="middle">transport</text>
<rect x="390" y="100" width="155" height="95" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="467.5" y="142.5" text-anchor="middle">Browser controls</text>
<text x="467.5" y="162.5" text-anchor="middle">and rendering</text>
<rect x="575" y="100" width="165" height="95" rx="12" fill="#e6f4ec" stroke="#46617d"/>
<text x="657.5" y="142.5" text-anchor="middle">Integrated</text>
<text x="657.5" y="162.5" text-anchor="middle">evidence</text>
<path d="M175 147 H205" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M360 147 H390" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M545 147 H575" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="380" y="245" text-anchor="middle">Tests and documentation accompany each implementation group.</text>
<text x="380" y="275" text-anchor="middle" class="small">Execution awaits an explicit apply request and an applicable sprint decision.</text>
