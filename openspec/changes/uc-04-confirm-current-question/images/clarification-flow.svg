<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
<title id="title">Live follows speech until it is cleared</title><desc id="desc">New questions, restatements and corrections fill and refine the Live question. Confirm question or Clear live clears it, and only speech heard afterwards can fill it again. Focus is not touched.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#46617d"/></marker></defs>
<style>text{font:16px Arial,sans-serif;fill:#19324a}.small{font-size:14px}.heading{font-size:21px;font-weight:bold}</style>
<rect width="760" height="310" rx="14" fill="#f7f9fc"/>
<text x="24" y="34" class="heading">Live follows speech until it is cleared</text>
<rect x="20" y="115" width="160" height="80" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="100.0" y="140.0" text-anchor="middle">Question,</text>
<text x="100.0" y="160.0" text-anchor="middle">restatement or</text>
<text x="100.0" y="180.0" text-anchor="middle">correction</text>
<rect x="260" y="115" width="200" height="80" rx="12" fill="#fff2d8" stroke="#46617d"/>
<text x="360.0" y="140.0" text-anchor="middle">Live updated</text>
<text x="360.0" y="160.0" text-anchor="middle">(tag: new question</text>
<text x="360.0" y="180.0" text-anchor="middle">or restatement)</text>
<rect x="540" y="115" width="200" height="80" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="640.0" y="140.0" text-anchor="middle">Confirm or</text>
<text x="640.0" y="160.0" text-anchor="middle">Clear live:</text>
<text x="640.0" y="180.0" text-anchor="middle">Live clears</text>
<path d="M180 155 H260" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460 155 H540" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640 195 V255 H100 V203" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="370" y="275" text-anchor="middle" class="small">only speech after the cutoff can fill Live again</text>
</svg>
