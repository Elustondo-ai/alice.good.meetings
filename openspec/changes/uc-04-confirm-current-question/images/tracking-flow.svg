<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" role="img" aria-labelledby="title desc">
<title id="title">Automatic tracking and protected clarification</title><desc id="desc">Clarification pauses automatic promotion. Confirmation retains the question through the answer. Evidence of a genuine next question re-enables automatic promotion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#46617d"/></marker></defs>
<style>text{font:16px Arial,sans-serif;fill:#19324a}.small{font-size:14px}.heading{font-size:21px;font-weight:bold}</style>
<rect width="760" height="305" rx="14" fill="#f7f9fc"/>
<text x="24" y="34" class="heading">Automatic tracking and protected clarification</text>
<rect x="20" y="105" width="200" height="85" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="120" y="152.5" text-anchor="middle">Automatic tracking</text>
<rect x="280" y="105" width="200" height="85" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="380" y="142.5" text-anchor="middle">Clarification requires</text>
<text x="380" y="162.5" text-anchor="middle">confirmation</text>
<rect x="540" y="105" width="200" height="85" rx="12" fill="#e6f4ec" stroke="#46617d"/>
<text x="640" y="142.5" text-anchor="middle">Retain question</text>
<text x="640" y="162.5" text-anchor="middle">through the answer</text>
<path d="M220 147 H280" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="91" text-anchor="middle" class="small">clarify</text>
<path d="M480 147 H540" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="510" y="91" text-anchor="middle" class="small">confirm</text>
<path d="M640 190 V250 H120 V190" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="380" y="275" text-anchor="middle" class="small">genuine next-question evidence</text>
</svg>
