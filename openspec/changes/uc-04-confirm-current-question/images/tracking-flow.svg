<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" role="img" aria-labelledby="title desc">
<title id="title">Focus stays fixed until Pablo confirms</title><desc id="desc">After confirmation Focus stays fixed through reflection and the answer. A new question appears only in Live; Focus changes only when Pablo confirms that Live wording.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#46617d"/></marker></defs>
<style>text{font:16px Arial,sans-serif;fill:#19324a}.small{font-size:14px}.heading{font-size:21px;font-weight:bold}</style>
<rect width="760" height="305" rx="14" fill="#f7f9fc"/>
<text x="24" y="34" class="heading">Focus stays fixed until Pablo confirms</text>
<rect x="20" y="115" width="160" height="80" rx="12" fill="#e6f4ec" stroke="#46617d"/>
<text x="100.0" y="150.0" text-anchor="middle">Focus confirmed</text>
<text x="100.0" y="170.0" text-anchor="middle">phase QUESTION</text>
<rect x="260" y="115" width="200" height="80" rx="12" fill="#e6f4ec" stroke="#46617d"/>
<text x="360.0" y="150.0" text-anchor="middle">Reflect and answer:</text>
<text x="360.0" y="170.0" text-anchor="middle">Focus unchanged</text>
<rect x="540" y="115" width="200" height="80" rx="12" fill="#fff2d8" stroke="#46617d"/>
<text x="640.0" y="150.0" text-anchor="middle">New question</text>
<text x="640.0" y="170.0" text-anchor="middle">appears in Live</text>
<path d="M180 155 H260" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460 155 H540" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640 195 V255 H100 V203" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="370" y="275" text-anchor="middle" class="small">Focus changes only when Pablo presses Confirm question</text>
</svg>
