<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Two ways to establish a question</title><desc id="desc">Clarification requires a reviewed draft and explicit confirmation. Automatic tracking remains available outside clarification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#46617d"/></marker></defs>
<style>text{font:16px Arial,sans-serif;fill:#19324a}.small{font-size:14px}.heading{font-size:21px;font-weight:bold}</style>
<rect width="760" height="300" rx="14" fill="#f7f9fc"/>
<text x="24" y="34" class="heading">Two ways to establish a question</text>
<rect x="20" y="75" width="155" height="80" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="97.5" y="110" text-anchor="middle">Spoken clarification</text>
<text x="97.5" y="130" text-anchor="middle">or Start question</text>
<rect x="205" y="75" width="145" height="80" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="277.5" y="110" text-anchor="middle">Reviewable</text>
<text x="277.5" y="130" text-anchor="middle">draft</text>
<rect x="380" y="75" width="145" height="80" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="452.5" y="110" text-anchor="middle">Confirm</text>
<text x="452.5" y="130" text-anchor="middle">displayed text</text>
<rect x="555" y="75" width="185" height="80" rx="12" fill="#e6f4ec" stroke="#46617d"/>
<text x="647.5" y="110" text-anchor="middle">Server acknowledges</text>
<text x="647.5" y="130" text-anchor="middle">retained question</text>
<path d="M175 115 H205" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 115 H380" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M525 115 H555" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="205" y="210" width="320" height="60" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="365" y="245" text-anchor="middle">Automatic tracking outside clarification</text>
<path d="M525 240 H647 V155" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
