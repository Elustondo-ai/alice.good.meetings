<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Two areas, one deliberate step between them</title><desc id="desc">Speech fills the Live question automatically. Only Confirm question copies the exact Live wording Pablo saw into the Focus question. Live then clears and refills from later speech while Focus stays fixed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#46617d"/></marker></defs>
<style>text{font:16px Arial,sans-serif;fill:#19324a}.small{font-size:14px}.heading{font-size:21px;font-weight:bold}</style>
<rect width="760" height="300" rx="14" fill="#f7f9fc"/>
<text x="24" y="34" class="heading">Two areas, one deliberate step between them</text>
<rect x="20" y="110" width="170" height="80" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="105.0" y="155.0" text-anchor="middle">Speech heard</text>
<rect x="270" y="110" width="190" height="80" rx="12" fill="#fff2d8" stroke="#46617d"/>
<text x="365.0" y="145.0" text-anchor="middle">Live question</text>
<text x="365.0" y="165.0" text-anchor="middle">(automatic)</text>
<rect x="540" y="110" width="200" height="80" rx="12" fill="#e6f4ec" stroke="#46617d"/>
<text x="640.0" y="145.0" text-anchor="middle">Focus question</text>
<text x="640.0" y="165.0" text-anchor="middle">(confirmed)</text>
<path d="M190 150 H270" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460 150 H540" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640 190 V245 H365 V198" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="138" text-anchor="middle" class="small">Confirm</text>
<text x="500" y="176" text-anchor="middle" class="small">question</text>
<text x="500" y="265" text-anchor="middle" class="small">Live clears; only later speech refills it</text>
</svg>
