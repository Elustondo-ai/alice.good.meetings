<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 325" role="img" aria-labelledby="title desc">
<title id="title">The browser confirms the Live tuple it displayed</title><desc id="desc">The browser sends question.confirm with liveId, liveVersion, expectedFocusVersion and the exact text. The controller validates and commits once to Focus, then sends question.result before the answer broadcast. The model can only change Live.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#46617d"/></marker></defs>
<style>text{font:16px Arial,sans-serif;fill:#19324a}.small{font-size:14px}.heading{font-size:21px;font-weight:bold}</style>
<rect width="760" height="325" rx="14" fill="#f7f9fc"/>
<text x="24" y="34" class="heading">The browser confirms the Live tuple it displayed</text>
<rect x="20" y="120" width="180" height="90" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="110.0" y="150.0" text-anchor="middle">Browser sends</text>
<text x="110.0" y="170.0" text-anchor="middle">liveId, liveVersion,</text>
<text x="110.0" y="190.0" text-anchor="middle">focus version, text</text>
<rect x="290" y="120" width="180" height="90" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="380.0" y="150.0" text-anchor="middle">Controller checks</text>
<text x="380.0" y="170.0" text-anchor="middle">and commits</text>
<text x="380.0" y="190.0" text-anchor="middle">once to Focus</text>
<rect x="560" y="75" width="180" height="70" rx="12" fill="#e6f4ec" stroke="#46617d"/>
<text x="650.0" y="105.0" text-anchor="middle">question.result</text>
<text x="650.0" y="125.0" text-anchor="middle">first</text>
<rect x="560" y="190" width="180" height="70" rx="12" fill="#e6f4ec" stroke="#46617d"/>
<text x="650.0" y="220.0" text-anchor="middle">answer broadcast</text>
<text x="650.0" y="240.0" text-anchor="middle">focus, live, revision</text>
<rect x="290" y="245" width="180" height="60" rx="12" fill="#fff2d8" stroke="#46617d"/>
<text x="380.0" y="270.0" text-anchor="middle">Model output:</text>
<text x="380.0" y="290.0" text-anchor="middle">Live only</text>
<path d="M200 165 H290" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M470 150 H515 V110 H560" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M470 180 H515 V225 H560" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M380 245 V218" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
