<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" role="img" aria-labelledby="title desc">
<title id="title">Confirm exactly the Live version that was seen</title><desc id="desc">The server validates session, Live identity, wording, Live version and Focus version. A match commits the text to Focus once; a stale or retired request leaves Focus unchanged and asks for review of the newer Live.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#46617d"/></marker></defs>
<style>text{font:16px Arial,sans-serif;fill:#19324a}.small{font-size:14px}.heading{font-size:21px;font-weight:bold}</style>
<rect width="760" height="305" rx="14" fill="#f7f9fc"/>
<text x="24" y="34" class="heading">Confirm exactly the Live version that was seen</text>
<rect x="20" y="115" width="170" height="80" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="105.0" y="150.0" text-anchor="middle">Displayed</text>
<text x="105.0" y="170.0" text-anchor="middle">Live version</text>
<rect x="270" y="115" width="180" height="80" rx="12" fill="#eaf1ff" stroke="#46617d"/>
<text x="360.0" y="150.0" text-anchor="middle">Validate identity,</text>
<text x="360.0" y="170.0" text-anchor="middle">wording, versions</text>
<rect x="550" y="65" width="190" height="70" rx="12" fill="#e6f4ec" stroke="#46617d"/>
<text x="645.0" y="95.0" text-anchor="middle">Commit to Focus</text>
<text x="645.0" y="115.0" text-anchor="middle">once, acknowledge</text>
<rect x="550" y="200" width="190" height="75" rx="12" fill="#fff2d8" stroke="#46617d"/>
<text x="645.0" y="232.5" text-anchor="middle">Keep Focus,</text>
<text x="645.0" y="252.5" text-anchor="middle">review newer Live</text>
<path d="M190 155 H270" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M450 140 H490 V100 H550" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M450 175 H490 V237 H550" fill="none" stroke="#46617d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="84" text-anchor="middle" class="small">match</text>
<text x="515" y="220" text-anchor="middle" class="small">stale / retired</text>
</svg>
