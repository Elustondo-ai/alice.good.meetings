<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Helper</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    *, *::before, *::after { box-sizing: border-box; }
    #panel {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: green;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: min(8rem, 20vw, 20vh);
      font-weight: bold;
      white-space: nowrap;
    }
    #controls {
      position: fixed;
      bottom: min(8px, 1vmin);
      right: min(8px, 1vmin);
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 100%;
      gap: min(4px, 0.5vmin);
    }
    #controls button {
      max-width: 100%;
      padding: min(2px, 0.5vmin) min(6px, 1vmin);
      font-size: min(11px, 2vmin);
      cursor: pointer;
    }
    #debug {
      position: fixed;
      top: min(8px, 1vmin);
      left: min(8px, 1vmin);
      max-width: calc(100% - 2 * min(8px, 1vmin));
      max-height: calc(100% - 2 * min(8px, 1vmin));
      margin: 0;
      overflow: hidden;
      overflow-wrap: anywhere;
      padding: min(8px, 1vmin) min(16px, 2vmin);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-family: monospace;
      font-size: min(24px, 2.5vmin);
      border-radius: min(8px, 1vmin);
    }
    #server {
      position: fixed;
      bottom: 44px;
      left: min(8px, 1vmin);
      max-width: min(760px, 96vw);
      max-height: 34vh;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 0;
      padding: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font: clamp(12px, 1.8vmin, 17px) monospace;
      border-radius: 6px;
    }
    #question {
      position: fixed;
      top: min(8px, 1vmin);
      right: min(8px, 1vmin);
      width: min(520px, 48vw);
      max-height: 50vh;
      overflow: auto;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.78);
      color: white;
      font: clamp(14px, 2.2vmin, 20px) sans-serif;
      border-radius: 6px;
    }
    #question p { margin: 4px 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #question .label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.85; }
    #question hr { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.25); margin: 6px 0; }
    #question .tag { text-transform: none; letter-spacing: 0; color: #ffd54a; opacity: 0.9; }
    #focus-question { font-weight: bold; }
    #focus-question.historical { opacity: 0.6; }
    #live-question { border-left: 3px solid #ffd54a; padding-left: 8px; font-style: italic; }
    #live-note, #question-feedback, #confirm-hint { font-size: 0.85em; }
    #confirm-hint { opacity: 0.8; margin-bottom: 0; }
    #question button { font-size: 0.85em; padding: 4px 10px; cursor: pointer; }
    #question button.primary:enabled { font-weight: bold; }
    #question button:disabled { cursor: not-allowed; }
    #question button:focus-visible { outline: 3px solid #ffd54a; outline-offset: 2px; }
    @media (max-width: 700px) {
      #question { left: min(8px, 1vmin); width: auto; max-height: 40vh; }
      #debug { top: auto; bottom: calc(44px + 34vh + 8px); }
    }
  </style>
</head>
<body>
  <div id="panel">GOOD</div>
  <pre id="debug"></pre>
  <pre id="server" role="status" aria-label="Server and agent responses"></pre>
  <section id="question" aria-label="Interview question">
    <div class="label">Focus question <span id="focus-status"></span></div>
    <p id="focus-question">No focus question yet</p>
    <hr>
    <div class="label">Live question <span id="live-tag" class="tag"></span></div>
    <p id="live-question">Not listening</p>
    <p id="live-note"></p>
    <p id="question-feedback" role="status" aria-live="polite"></p>
    <button id="confirm-question" class="primary" type="button" disabled aria-describedby="confirm-hint">Confirm question</button>
    <button id="clear-live" type="button" disabled>Clear live</button>
    <p id="confirm-hint"></p>
  </section>
  <div id="controls">
    <button id="listen">Start Listening</button>
    <button data-state="good">Good</button>
    <button data-state="land">Land it</button>
    <button data-state="stop">Stop</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
